stages:
  - test

application:test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  timeout: 30m
  services:
    - name: redis:7.4-alpine
      alias: redis
    - name: postgres:16.10-alpine
      alias: postgres
  variables:
    REDIS_URL: "redis://redis:6379"
    RUN_REDIS_INTEGRATION: "1"
    DISTRIBUTED_TRANSPORT_TEST_REDIS_URL: "redis://redis:6379"
    DISTRIBUTED_RUNTIME_TEST_DATABASE_URL: "postgres://trinitymatrix_ci:trinitymatrix_ci@postgres:5432/trinitymatrix_test"
    POSTGRES_DB: "trinitymatrix_test"
    POSTGRES_USER: "trinitymatrix_ci"
    POSTGRES_PASSWORD: "trinitymatrix_ci"
    CI: "true"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm audit --omit=dev --audit-level=moderate
    - npm run typecheck
    - npm run test:unit
    - npm run test:load
    - npm run build
    - npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/
