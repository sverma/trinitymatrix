server {
    listen 80;
    listen [::]:80;
    server_name trinitymatrix.org www.trinitymatrix.org;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503 "TrinityMatrix deployment is being prepared. Please try again shortly.\n"; }
}
