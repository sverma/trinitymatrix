map $http_upgrade $trinitymatrix_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name trinitymatrix.org www.trinitymatrix.org;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://trinitymatrix.org$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.trinitymatrix.org;
    ssl_certificate /etc/letsencrypt/live/trinitymatrix.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trinitymatrix.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://trinitymatrix.org$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trinitymatrix.org;
    ssl_certificate /etc/letsencrypt/live/trinitymatrix.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trinitymatrix.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 16k;
    access_log /var/log/nginx/trinitymatrix-access.log;
    error_log /var/log/nginx/trinitymatrix-error.log warn;
    location ~ ^/(?:internal/|healthz$|readyz$|version$) { return 404; }
    location ~ ^/api/live(?:/|$) {
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trinitymatrix_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
